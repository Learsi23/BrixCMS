name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BrixCMS.Open/BrixCMS.Open.csproj

    - name: Build
      run: dotnet build BrixCMS.Open/BrixCMS.Open.csproj --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Tests/BrixCMS.Open.Tests.csproj --no-restore --configuration Release
